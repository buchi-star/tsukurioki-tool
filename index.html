<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>作り置き献立メーカー</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
      background: #f5f5f0;
      color: #333;
      padding: 24px 16px;
    }

    .container {
      max-width: 680px;
      margin: 0 auto;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 24px;
      color: #2d2d2d;
    }

    .input-section {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 24px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }

    label {
      display: block;
      font-size: 0.9rem;
      color: #555;
      margin-bottom: 10px;
    }

    textarea {
      width: 100%;
      height: 100px;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 1rem;
      font-family: inherit;
      resize: vertical;
      line-height: 1.6;
    }

    textarea:focus {
      outline: none;
      border-color: #5a8a6a;
    }

    button {
      display: block;
      width: 100%;
      margin-top: 12px;
      padding: 13px;
      background: #5a8a6a;
      color: white;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    button:hover {
      background: #4a7a5a;
    }

    button:disabled {
      background: #aaa;
      cursor: not-allowed;
    }

    /* ローディング */
    .loading {
      text-align: center;
      padding: 32px;
      color: #666;
      font-size: 0.95rem;
    }

    .spinner {
      display: inline-block;
      width: 24px;
      height: 24px;
      border: 3px solid #ddd;
      border-top-color: #5a8a6a;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 10px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* エラー */
    .error {
      background: #fff0f0;
      border: 1px solid #f5c0c0;
      border-radius: 8px;
      padding: 14px 16px;
      color: #c0392b;
      font-size: 0.9rem;
    }

    /* 料理カード */
    .dish-card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }

    .dish-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 14px;
    }

    .dish-name {
      font-size: 1.2rem;
      font-weight: 700;
      color: #2d2d2d;
      line-height: 1.4;
    }

    .dish-meta {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .badge {
      font-size: 0.75rem;
      padding: 3px 9px;
      border-radius: 20px;
      white-space: nowrap;
    }

    .badge-method {
      background: #eaf2ee;
      color: #4a7a5a;
    }

    .badge-days {
      background: #fef6e4;
      color: #b07a00;
    }

    .section-title {
      font-size: 0.85rem;
      font-weight: 600;
      color: #5a8a6a;
      letter-spacing: 0.03em;
      margin-bottom: 6px;
    }

    .ingredients-list {
      font-size: 0.9rem;
      color: #3d5c47;
      line-height: 1.7;
      background: #edf5f0;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 14px;
    }

    .steps-list {
      list-style: none;
      padding: 0;
    }

    .steps-list li {
      font-size: 0.9rem;
      color: #444;
      line-height: 1.7;
      padding-left: 22px;
      position: relative;
      margin-bottom: 6px;
    }

    .steps-list li::before {
      content: attr(data-step);
      position: absolute;
      left: 0;
      font-size: 0.75rem;
      font-weight: 700;
      color: #5a8a6a;
      top: 3px;
    }

    /* フォールバック（JSON解析失敗時） */
    .fallback-text {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      font-size: 0.9rem;
      line-height: 1.8;
      white-space: pre-wrap;
      color: #444;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>作り置き献立メーカー</h1>

    <div class="input-section">
      <label for="ingredients">今ある食材を入力してください（例：鮭、ブロッコリー、卵、玉ねぎ）</label>
      <textarea
        id="ingredients"
        placeholder="鮭、ブロッコリー、玉ねぎ、にんにく、レモン、卵..."
      ></textarea>
      <button id="submit-btn">献立を提案する</button>
    </div>

    <div id="loading" class="loading hidden">
      <div class="spinner"></div>
      <div>献立を考えています…</div>
    </div>

    <div id="results"></div>
  </div>

  <script>
    const submitBtn = document.getElementById('submit-btn');
    const loadingEl = document.getElementById('loading');
    const resultsEl = document.getElementById('results');
    const ingredientsEl = document.getElementById('ingredients');

    submitBtn.addEventListener('click', async () => {
      const ingredients = ingredientsEl.value.trim();
      if (!ingredients) {
        alert('食材を入力してください');
        return;
      }

      // ローディング開始
      submitBtn.disabled = true;
      loadingEl.classList.remove('hidden');
      resultsEl.innerHTML = '';

      try {
        const res = await fetch('/api/suggest', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ ingredients }),
        });

        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || 'サーバーエラーが発生しました');
        }

        // JSONとして解析を試みる
        // Claudeがmarkdownコードブロック(```json ... ```)で返すことがあるので除去する
        try {
          let jsonText = data.text.trim();
          if (jsonText.startsWith('```')) {
            jsonText = jsonText.replace(/^```[a-z]*\n?/, '').replace(/\n?```$/, '');
          }
          const parsed = JSON.parse(jsonText);
          renderDishes(parsed.dishes);
        } catch {
          // JSON解析に失敗した場合はテキストをそのまま表示する
          renderFallback(data.text);
        }

      } catch (err) {
        resultsEl.innerHTML = `<div class="error">エラー：${err.message}</div>`;
      } finally {
        submitBtn.disabled = false;
        loadingEl.classList.add('hidden');
      }
    });

    // 料理カードを生成して表示する
    function renderDishes(dishes) {
      resultsEl.innerHTML = dishes.map(dish => `
        <div class="dish-card">
          <div class="dish-header">
            <div class="dish-name">${escapeHtml(dish.name)}</div>
            <div class="dish-meta">
              <span class="badge badge-method">${escapeHtml(dish.cooking_method)}</span>
              <span class="badge badge-days">${dish.storage_days}日保存</span>
            </div>
          </div>

          <div class="section-title">食材</div>
          <div class="ingredients-list">${dish.ingredients.map(i => escapeHtml(i)).join('、')}</div>

          <div class="section-title">作り方</div>
          <ol class="steps-list">
            ${dish.steps.map((step, i) => `
              <li data-step="${i + 1}">${escapeHtml(step)}</li>
            `).join('')}
          </ol>
        </div>
      `).join('');
    }

    // JSON解析に失敗したときのフォールバック表示
    function renderFallback(text) {
      resultsEl.innerHTML = `<div class="fallback-text">${escapeHtml(text)}</div>`;
    }

    // XSS対策：HTMLエスケープ
    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }
  </script>
</body>
</html>
